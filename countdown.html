<style>

:root{
  --bg:#f2f4f8; --panel:#ffffff; --panel2:#f7f9fc; --line:#dde2ea;
  --txt:#141922; --dim:#5d6675; --dim2:#8d97a6;
  --accent:#0e7c66; --amber:#b45309; --red:#dc2626; --safe:#16a34a;
  --chip-bg:#eaf3f0; --chip-border:#cfe3dc;
  --hover-bg:#eef1f6; --hover-border:#c8d0dc;
  --danger-bg:#fef2f2; --danger-border:#f6cfcf;
  --danger-hover-bg:#fde3e3; --danger-hover-border:#eeb4b4;
  --stage:#0b0c10; --stage-dot:#242832;
  --shadow:0 1px 2px rgba(20,25,34,.05), 0 8px 24px -12px rgba(20,25,34,.18);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e11; --panel:#17171c; --panel2:#1d1d23; --line:#2b2b33;
    --txt:#ececed; --dim:#9498a3; --dim2:#6b6e78;
    --accent:#2dd4bf; --amber:#f59e0b; --red:#ef4444; --safe:#22c55e;
    --chip-bg:#0f2b25; --chip-border:#1c4a3d;
    --hover-bg:#22232b; --hover-border:#3a3b45;
    --danger-bg:#3a1414; --danger-border:#5c2323;
    --danger-hover-bg:#4a1a1a; --danger-hover-border:#6e2b2b;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e11; --panel:#17171c; --panel2:#1d1d23; --line:#2b2b33;
  --txt:#ececed; --dim:#9498a3; --dim2:#6b6e78;
  --accent:#2dd4bf; --amber:#f59e0b; --red:#ef4444; --safe:#22c55e;
  --chip-bg:#0f2b25; --chip-border:#1c4a3d;
  --hover-bg:#22232b; --hover-border:#3a3b45;
  --danger-bg:#3a1414; --danger-border:#5c2323;
  --danger-hover-bg:#4a1a1a; --danger-hover-border:#6e2b2b;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); padding:18px;
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:14px;
}
.topbar{max-width:1800px;margin:0 auto 18px;display:flex;align-items:center;gap:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;box-shadow:var(--shadow)}
.topbar .logo{width:34px;height:34px;flex:0 0 auto;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(20,25,34,.15)}
.topbar .logo svg{display:block;width:100%;height:100%}
.topbar .brand-name{font-size:15px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.topbar .brand-sub{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.topbar .brand-link{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar .home{font-size:12px;color:var(--dim);text-decoration:none;
  border:1px solid var(--line);border-radius:8px;padding:6px 12px;white-space:nowrap}
.topbar .home:hover{background:var(--panel2);color:var(--txt);border-color:var(--dim2)}
.theme-toggle{display:flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;flex:0 0 auto;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--dim);cursor:pointer}
.theme-toggle:hover{color:var(--txt);border-color:var(--dim2);background:var(--hover-bg)}
.theme-toggle svg{width:16px;height:16px}
.theme-toggle .i-sun{display:block}
.theme-toggle .i-moon{display:none}
:root[data-theme="dark"] .theme-toggle .i-sun{display:none}
:root[data-theme="dark"] .theme-toggle .i-moon{display:block}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-toggle .i-sun{display:none}
  :root:not([data-theme="light"]) .theme-toggle .i-moon{display:block}
}

.wrap{max-width:1800px;margin:0 auto;display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
@media(max-width:1100px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
h1{font-size:18px;color:var(--accent);margin-bottom:2px}
.sub{font-size:11px;color:var(--dim)}
h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
button{font-family:inherit;font-size:13px;border-radius:8px;cursor:pointer;border:1px solid var(--line);
  background:var(--panel);color:var(--txt);padding:8px 12px;transition:.15s;box-shadow:0 1px 1px rgba(20,25,34,.04)}
button:hover{background:var(--hover-bg);border-color:var(--hover-border)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--safe);border-color:var(--safe);color:#fff;font-weight:700;width:100%;padding:12px;font-size:15px}
button.primary:hover{filter:brightness(.92)}
button.primary.pause{background:var(--amber);border-color:var(--amber)}
button.danger{background:var(--danger-bg);border-color:var(--danger-border);color:var(--red)}
button.danger:hover{background:var(--danger-hover-bg);border-color:var(--danger-hover-border)}
button.mini{padding:7px 4px;font-size:12px}
button.preset{padding:8px 4px;font-size:12px}
button.preset.active{background:var(--chip-bg);border-color:var(--chip-border);color:var(--accent);font-weight:700}
#colorPickers input[type=color]{-webkit-appearance:none;appearance:none;width:100%;height:30px;
  border:1px solid var(--line);border-radius:7px;padding:0;background:var(--panel2);cursor:pointer}
#colorPickers input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
#colorPickers input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
#colorPickers input[type=color]::-moz-color-swatch{border:0;border-radius:4px}
#colorPickers input[type=color]:disabled{opacity:.4;cursor:not-allowed}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
label.f{display:block;font-size:10px;color:var(--dim2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
input[type=number],input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  color:var(--txt);padding:6px 8px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,124,102,.14)}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none;margin-top:8px}
.note{font-size:11px;color:var(--dim2);line-height:1.6;margin-top:8px}
.note kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:ui-monospace,Consolas,monospace}

.audiopick{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2);margin-top:8px}
.audiopick-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.audiopick-btns{display:flex;gap:4px;flex:0 0 auto}
.audiopick-btns button{padding:5px 8px;font-size:12px}
.audiopick-btns button.on{background:var(--chip-bg);border-color:var(--chip-border);color:var(--accent)}
.audioname{margin-top:5px;word-break:break-all}

.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12px;
  color:var(--dim);margin-bottom:14px;box-shadow:var(--shadow)}
.bar .status{font-weight:700;letter-spacing:.03em}
.bar .status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--dim2)}
.state-safe .bar .status{color:var(--safe)}
.state-safe .bar .status::before{background:var(--safe)}
.state-warn .bar .status{color:var(--amber)}
.state-warn .bar .status::before{background:var(--amber)}
.state-crit .bar .status{color:var(--red)}
.state-crit .bar .status::before{background:var(--red);animation:blink 1s step-start infinite}
.state-over .bar .status{color:var(--red)}
.state-over .bar .status::before{background:var(--red);animation:blink .5s step-start infinite}
@keyframes blink{50%{opacity:.15}}

:root{
  --cd-bg:#0b0c10; --cd-digit:#ffffff; --cd-text:#e7e9ee; --cd-ring:#16a34a; --cd-ring-track:rgba(255,255,255,.08);
}
#stageWrap{background:var(--cd-bg);border:1px solid var(--line);border-radius:12px;padding:20px;
  min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;
  background-image:radial-gradient(var(--stage-dot) 1px,transparent 1px);background-size:16px 16px;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.5);transition:background .2s}
#sessionName{color:var(--cd-text);font-size:clamp(14px,2.4vmin,26px);font-weight:600;letter-spacing:.02em;
  margin-bottom:10px;text-align:center;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s}
.ring-wrap{position:relative;display:flex;align-items:center;justify-content:center;
  width:min(60vmin,520px);height:min(60vmin,520px);max-width:100%}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--cd-ring-track);stroke-width:5}
.ring-fg{fill:none;stroke:var(--cd-ring);stroke-width:5;stroke-linecap:round;
  transition:stroke-dashoffset .25s linear, stroke .3s}
body:not(.stage-custom).state-warn .ring-fg{stroke:var(--amber)}
body:not(.stage-custom).state-crit .ring-fg{stroke:var(--red)}
body:not(.stage-custom).state-over .ring-fg{stroke:var(--red)}
#display{font-family:ui-monospace,Consolas,monospace;font-weight:800;letter-spacing:.02em;
  font-size:clamp(48px,13vmin,180px);color:var(--cd-digit);line-height:1;z-index:1;text-align:center;transition:color .2s}
body:not(.stage-custom).state-warn #display{color:var(--amber)}
body:not(.stage-custom).state-crit #display{color:var(--red)}
body:not(.stage-custom).state-over #display{color:var(--red)}
.state-over #display{animation:blink .6s step-start infinite}
#stateLabel{margin-top:14px;font-size:clamp(11px,1.8vmin,15px);letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;color:var(--cd-text);opacity:.72;z-index:1;transition:color .2s}
body:not(.stage-custom).state-safe #stateLabel{color:var(--safe);opacity:1}
body:not(.stage-custom).state-warn #stateLabel{color:var(--amber);opacity:1}
body:not(.stage-custom).state-crit #stateLabel{color:var(--red);opacity:1}
body:not(.stage-custom).state-over #stateLabel{color:var(--red);opacity:1}

.present-btn{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);
  color:#d7d9de;z-index:2}
.present-btn:hover{background:rgba(255,255,255,.16)}

body.presenting{padding:0;background:var(--cd-bg)}
body.presenting .topbar,body.presenting .card,body.presenting .bar{display:none}
body.presenting .wrap{max-width:none;display:block}
body.presenting #stageWrap{min-height:100vh;border-radius:0;border:0}
body.presenting .ring-wrap{width:min(72vmin,760px);height:min(72vmin,760px)}
body.presenting #display{font-size:clamp(60px,18vmin,320px)}

.credit{max-width:1800px;margin:18px auto 4px;text-align:center;font-size:11px;color:var(--dim2);
  padding-top:14px;border-top:1px solid var(--line)}
.credit b{color:var(--dim)}
.credit a{color:var(--accent);text-decoration:none}
.credit a:hover{text-decoration:underline}
body.presenting .credit{display:none}


/* ===== Màn hình khóa mật khẩu ===== */
.lockwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(160deg,#dce6f7,#eef1fb);}
:root[data-theme="dark"] .lockwrap{background:linear-gradient(160deg,#101018,#181a24);}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lockwrap{background:linear-gradient(160deg,#101018,#181a24);}}
.lockcard{background:#fff;border-radius:18px;box-shadow:0 20px 50px -20px rgba(20,25,60,.35);
  padding:36px 32px;max-width:380px;width:100%;text-align:center;}
:root[data-theme="dark"] .lockcard{background:#181920;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lockcard{background:#181920;}}
.lockicon{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;
  background:linear-gradient(145deg,#ffcf7a,#f5a623);display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 8px 20px -6px rgba(245,166,35,.6);}
.locktitle{font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:700;color:#1c2541;margin-bottom:6px;}
:root[data-theme="dark"] .locktitle{color:#ececed;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .locktitle{color:#ececed;}}
.locksub{font-size:13px;color:#697086;margin-bottom:22px;line-height:1.5;}
:root[data-theme="dark"] .locksub{color:#9498a3;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .locksub{color:#9498a3;}}
.lockinput{width:100%;padding:12px 14px;border-radius:9px;border:1.5px solid #d7dced;
  font-size:14px;margin-bottom:6px;outline:none;box-sizing:border-box;background:#fff;color:#1c2541;font-family:inherit;}
.lockinput:focus{border-color:#3b6fea;box-shadow:0 0 0 3px rgba(59,111,234,.15);}
:root[data-theme="dark"] .lockinput{background:#101116;border-color:#2b2b33;color:#ececed;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lockinput{background:#101116;border-color:#2b2b33;color:#ececed;}}
.lockerror{color:#dc2626;font-size:12.5px;margin:4px 0 10px;text-align:left;display:none;}
.lockbtn{width:100%;padding:12px;border:0;border-radius:9px;background:#3b6fea;color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:filter .15s;font-family:inherit;}
.lockbtn:hover{filter:brightness(.92);}
.lockbtn:disabled{opacity:.6;cursor:default;}
.lockhr{border:0;border-top:1px solid #e6e9f2;margin:22px 0 16px;}
:root[data-theme="dark"] .lockhr{border-top-color:#2b2b33;}
.lockfooter{font-size:11.5px;color:#8a90a6;line-height:1.6;}
.lockfooter a{color:#3b6fea;text-decoration:none;}
.lockfooter a:hover{text-decoration:underline;}
</style>
</head>

function hexToBytes(hex){
  var bytes = new Uint8Array(hex.length/2);
  for(var i=0;i<bytes.length;i++) bytes[i] = parseInt(hex.substr(i*2,2),16);
  return bytes;
}
function base64ToBytes(b64){
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function bytesToBase64(bytes){
  var binary = '';
  var chunk = 0x8000;
  for(var i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(binary);
}

var SALT = hexToBytes(SALT_HEX);
var IV = hexToBytes(IV_HEX);
var CT = base64ToBytes(CT_B64);

function deriveKeyFromPassword(password){
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']).then(function(baseKey){
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: SALT, iterations: 300000, hash:'SHA-256' },
      baseKey, { name:'AES-GCM', length:256 }, true, ['decrypt']
    );
  });
}
function importRawKey(rawB64){
  return crypto.subtle.importKey('raw', base64ToBytes(rawB64), {name:'AES-GCM'}, true, ['decrypt']);
}
function decryptWithKey(key){
  return crypto.subtle.decrypt({name:'AES-GCM', iv: IV}, key, CT).then(function(buf){
    return new TextDecoder().decode(buf);
  });
}
function revealContent(html){
  var scripts = [];
  var markup = html.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gi, function(m, code){
    scripts.push(code);
    return '';
  });
  document.getElementById('realContent').innerHTML = markup;
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('realContent').style.display = '';
  scripts.forEach(function(code){
    var s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  });
}
function showError(msg){
  var el = document.getElementById('lockError');
  el.textContent = msg;
  el.style.display = 'block';
}

function tryUnlock(password){
  return deriveKeyFromPassword(password).then(function(key){
    return decryptWithKey(key).then(function(html){
      return crypto.subtle.exportKey('raw', key).then(function(raw){
        try{ sessionStorage.setItem('avltools-lockkey', bytesToBase64(new Uint8Array(raw))); }catch(e){}
        revealContent(html);
      });
    });
  });
}

function tryAutoUnlock(){
  var cached;
  try{ cached = sessionStorage.getItem('avltools-lockkey'); }catch(e){ cached = null; }
  if(!cached) return;
  importRawKey(cached).then(decryptWithKey).then(revealContent).catch(function(){ /* im lặng, hiện màn hình nhập mật khẩu */ });
}
tryAutoUnlock();

var btn = document.getElementById('btnUnlock');
var pwInput = document.getElementById('pwInput');
function doUnlock(){
  var pw = pwInput.value;
  if(!pw) return;
  document.getElementById('lockError').style.display = 'none';
  btn.disabled = true; btn.textContent = 'Đang mở...';
  tryUnlock(pw).catch(function(){
    showError('Sai mật khẩu, vui lòng thử lại.');
  }).then(function(){
    btn.disabled = false; btn.textContent = 'Mở khóa';
  });
}
btn.addEventListener('click', doUnlock);
pwInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') doUnlock(); });
})();
