<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
try{
  var _t = localStorage.getItem('avltools-theme');
  if(_t === 'light' || _t === 'dark') document.documentElement.setAttribute('data-theme', _t);
}catch(e){}
</script>
<style>

/* ===================== BIẾN MÀU & FONT CHUNG (Cyberpunk / Dark Mode) ===================== */
:root{
  --bg-dark: #08070d;
  --bg-panel: #12111c;
  --bg-panel-2: #181726;
  --neon-cyan: #00fff2;
  --neon-pink: #ff2ec4;
  --neon-purple: #b026ff;
  --neon-yellow: #f7ff00;
  --text-main: #e8e8f5;
  --text-dim: #8a8aa3;
  --border-soft: rgba(0,255,242,0.15);
  --tile-bg: #171625;
  --track-bg: #22212f;
  --pad-radial-end: #14131f;
  --pad-radial-playing-end: #1c1a2c;
  --body-bg: radial-gradient(circle at 15% 20%, rgba(176,38,255,0.15), transparent 40%),
             radial-gradient(circle at 85% 80%, rgba(0,255,242,0.12), transparent 40%),
             linear-gradient(180deg, #060509 0%, #0b0a13 100%);
  --grid-line-color: rgba(0,255,242,0.04);
}

/* ===================== CHẾ ĐỘ SÁNG (Light Mode) ===================== */
/* Bấm nút Sáng/Tối ở góc trên bên phải sẽ gắn class này vào <body> */
body.theme-light{
  --bg-dark: #eef0f7;
  --bg-panel: #ffffff;
  --bg-panel-2: #f2f3fb;
  --neon-cyan: #0aa7a0;
  --neon-pink: #d6169b;
  --neon-purple: #7b2fd6;
  --neon-yellow: #b98f00;
  --text-main: #1c1c2b;
  --text-dim: #62627a;
  --border-soft: rgba(20,20,40,0.14);
  --tile-bg: #eef0fa;
  --track-bg: #dfe1f0;
  --pad-radial-end: #ffffff;
  --pad-radial-playing-end: #eef3ff;
  --body-bg: radial-gradient(circle at 15% 20%, rgba(176,38,255,0.08), transparent 40%),
             radial-gradient(circle at 85% 80%, rgba(10,167,160,0.08), transparent 40%),
             linear-gradient(180deg, #f5f6fb 0%, #e9ebf7 100%);
  --grid-line-color: rgba(20,20,40,0.05);
}

*{ box-sizing: border-box; margin:0; padding:0; }

body{
  min-height: 100vh;
  background: var(--body-bg);
  background-attachment: fixed;
  color: var(--text-main);
  font-family: 'Segoe UI', 'Trebuchet MS', Arial, sans-serif;
  padding: 24px 16px 90px; /* chừa chỗ cho thanh "Đang phát" cố định phía dưới */
  transition: background 0.3s ease, color 0.3s ease;
}

/* Hiệu ứng lưới nền kiểu cyberpunk (tự đổi màu theo theme) */
body::before{
  content:"";
  position: fixed; inset:0;
  background-image:
    linear-gradient(var(--grid-line-color) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line-color) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

/* Nút chuyển chế độ Sáng / Tối - luôn nổi ở góc trên bên phải */
.theme-toggle-btn{
  position: fixed;
  top: 16px; right: 16px;
  z-index: 20;
  width: 46px; height: 46px;
  border-radius: 50%;
  border: 1.5px solid var(--border-soft);
  background: var(--bg-panel);
  color: var(--text-main);
  font-size: 1.25rem;
  cursor: pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 0 10px rgba(0,255,242,0.2);
  transition: all 0.2s ease;
}
.theme-toggle-btn:hover{ box-shadow: 0 0 16px var(--neon-cyan); transform: scale(1.06); }

/* Nút quay về Trang tổng của bộ công cụ — luôn nổi ở góc trên bên trái */
.back-home-link{
  position: fixed;
  top: 16px; left: 16px;
  z-index: 20;
  display:flex; align-items:center;
  height: 46px;
  padding: 0 16px;
  border-radius: 23px;
  border: 1.5px solid var(--border-soft);
  background: var(--bg-panel);
  color: var(--text-main);
  font-size: 0.78rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  text-decoration: none;
  white-space: nowrap;
  box-shadow: 0 0 10px rgba(0,255,242,0.2);
  transition: all 0.2s ease;
}
.back-home-link:hover{ box-shadow: 0 0 16px var(--neon-cyan); color: var(--neon-cyan); }

/* ===================== THANH "ĐANG PHÁT" CỐ ĐỊNH ===================== */
/* Luôn hiện ở đáy màn hình để thấy ngay Pad nào đang chạy và dừng nhanh,
   không phải dò tìm giữa 15 pad khi đang chạy sự kiện. */
.now-playing-bar{
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 15;
  background: var(--bg-panel);
  border-top: 1px solid var(--border-soft);
  box-shadow: 0 -6px 24px rgba(0,0,0,0.45);
  padding: 10px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.now-playing-bar .np-label{
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--neon-cyan);
  white-space: nowrap;
}
.now-playing-list{
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.now-playing-empty{
  font-size: 0.78rem;
  color: var(--text-dim);
  font-style: italic;
}
.now-playing-chip{
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--tile-bg);
  border: 1px solid var(--neon-cyan);
  color: var(--neon-cyan);
  padding: 5px 6px 5px 10px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 700;
  box-shadow: 0 0 8px rgba(0,255,242,0.3);
}
.now-playing-chip .np-stop{
  border: none;
  background: rgba(255,46,196,0.15);
  color: var(--neon-pink);
  width: 20px; height: 20px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 0.72rem;
  line-height: 1;
  display:flex; align-items:center; justify-content:center;
  transition: all 0.2s;
}
.now-playing-chip .np-stop:hover{ box-shadow: 0 0 8px rgba(255,46,196,0.6); }

.wrap{ position: relative; z-index: 1; max-width: 1800px; margin: 0 auto; }

/* ===================== HEADER ===================== */
header{ text-align:center; margin-bottom: 30px; }
header h1{
  font-size: clamp(1.6rem, 4vw, 2.6rem);
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-main);
  text-shadow: 0 0 8px var(--neon-cyan), 0 0 22px rgba(0,255,242,0.5);
  font-weight: 800;
}
header p{
  margin-top: 8px;
  color: var(--text-dim);
  letter-spacing: 2px;
  font-size: 0.85rem;
  text-transform: uppercase;
}
header span{ color: var(--neon-pink); }

/* ===================== BỐ CỤC CHÍNH: 2 CỘT ===================== */
.main-grid{
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 24px;
  align-items: start;
}
@media (max-width: 900px){
  .main-grid{ grid-template-columns: 1fr; }
}

.panel{
  background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
  border: 1px solid var(--border-soft);
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset, 0 10px 40px rgba(0,0,0,0.5);
}

.panel-title{
  display:flex; align-items:center; gap:10px;
  font-size: 1.05rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--neon-cyan);
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 1px dashed var(--border-soft);
}
.panel-title .dot{
  width:10px; height:10px; border-radius:50%;
  background: var(--neon-cyan);
  box-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
  animation: blink 1.6s infinite ease-in-out;
}
@keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }

/* Nút "Dừng tất cả Pad" nằm cạnh tiêu đề khu Pad */
.stop-all-btn{
  margin-left: auto;
  font-size: 0.68rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 6px 12px;
  border-radius: 20px;
  border: 1px solid var(--neon-pink);
  background: rgba(255,46,196,0.08);
  color: var(--neon-pink);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}
.stop-all-btn:hover{ box-shadow: 0 0 12px rgba(255,46,196,0.6); }

.pad-hint{
  font-size: 0.72rem;
  color: var(--text-dim);
  margin: 0 0 14px;
  letter-spacing: 0.3px;
}

/* Thanh công cụ tải nhạc hàng loạt cho Pad */
.pad-toolbar{
  display:flex; align-items:center; flex-wrap:wrap;
  gap: 10px;
  margin-bottom: 10px;
}
.pad-bulk-label{
  display:inline-block;
  padding: 8px 16px;
  border-radius: 8px;
  background: linear-gradient(90deg, rgba(0,255,242,0.18), rgba(176,38,255,0.18));
  border: 1px solid var(--neon-cyan);
  color: var(--text-main);
  cursor: pointer;
  font-size: 0.78rem;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.2s;
}
.pad-bulk-label:hover{ box-shadow: 0 0 14px rgba(0,255,242,0.5); }
.bulk-status{
  font-size: 0.72rem;
  color: var(--neon-cyan);
}

/* ===================== PHẦN 1: MUSIC PLAYER ===================== */
#now-playing{
  text-align:center;
  padding: 14px 10px 20px;
}
#now-playing .track-name{
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-main);
  text-shadow: 0 0 10px rgba(0,255,242,0.4);
  white-space: nowrap; overflow:hidden; text-overflow: ellipsis;
}
#now-playing .track-sub{
  margin-top:4px;
  font-size: 0.78rem;
  color: var(--text-dim);
  letter-spacing: 1px;
}

/* Thanh tiến trình */
.progress-area{ margin: 18px 0; }
.progress-times{
  display:flex; justify-content: space-between;
  font-size: 0.75rem; color: var(--text-dim);
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}
input[type="range"]#progress-bar{
  -webkit-appearance: none;
  width: 100%;
  height: 8px;
  border-radius: 6px;
  background: var(--track-bg);
  outline: none;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--border-soft);
}
input[type="range"]#progress-bar::-webkit-slider-thumb{
  -webkit-appearance: none;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--neon-cyan);
  box-shadow: 0 0 8px var(--neon-cyan), 0 0 16px var(--neon-cyan);
  cursor: pointer;
  border: 2px solid #08070d;
}
input[type="range"]#progress-bar::-moz-range-thumb{
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--neon-cyan);
  box-shadow: 0 0 8px var(--neon-cyan), 0 0 16px var(--neon-cyan);
  cursor: pointer; border: 2px solid #08070d;
}

/* Nút điều khiển chính */
.controls-row{
  display:flex; justify-content:center; align-items:center;
  gap: 16px; margin: 16px 0 8px;
}
.ctrl-btn{
  width: 58px; height: 58px;
  border-radius: 50%;
  border: 1.5px solid var(--border-soft);
  background: var(--tile-bg);
  color: var(--text-main);
  font-size: 1.3rem;
  cursor: pointer;
  display:flex; align-items:center; justify-content:center;
  transition: all 0.2s ease;
}
.ctrl-btn:hover{ border-color: var(--neon-cyan); box-shadow: 0 0 12px rgba(0,255,242,0.35); transform: translateY(-2px); }
.ctrl-btn:active{ transform: translateY(0); }
.ctrl-btn.big{ width: 72px; height: 72px; font-size: 1.7rem; }

.ctrl-btn.active-glow{
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  box-shadow: 0 0 10px var(--neon-cyan), 0 0 26px rgba(0,255,242,0.6);
}
.ctrl-btn.loop-on{
  border-color: var(--neon-yellow);
  color: var(--neon-yellow);
  box-shadow: 0 0 10px var(--neon-yellow), 0 0 26px rgba(247,255,0,0.55);
}

/* Volume */
.volume-row{
  display:flex; align-items:center; gap: 10px;
  margin-top: 14px; padding: 0 6px;
  color: var(--text-dim); font-size: 0.85rem;
}
.volume-row input[type="range"]{
  flex:1; height:5px; border-radius:5px; background: var(--track-bg);
  -webkit-appearance:none; cursor:pointer;
}
.volume-row input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
  background: var(--neon-purple); box-shadow: 0 0 8px var(--neon-purple);
  cursor:pointer;
}

/* Upload nhạc nền */
.upload-box{
  margin-top: 18px;
  border: 1.5px dashed var(--border-soft);
  border-radius: 10px;
  padding: 12px;
  text-align:center;
}
.upload-label{
  display:inline-block;
  padding: 9px 18px;
  border-radius: 8px;
  background: linear-gradient(90deg, rgba(176,38,255,0.25), rgba(0,255,242,0.2));
  border: 1px solid var(--neon-purple);
  color: var(--text-main);
  cursor: pointer;
  font-size: 0.85rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.2s;
}
.upload-label:hover{ box-shadow: 0 0 14px rgba(176,38,255,0.6); }
#upload-music{ display:none; }

/* Playlist */
.playlist{
  margin-top: 18px;
  list-style: none;
  max-height: 220px;
  overflow-y: auto;
  display:flex; flex-direction:column; gap: 6px;
}
.playlist::-webkit-scrollbar{ width:6px; }
.playlist::-webkit-scrollbar-thumb{ background: var(--neon-purple); border-radius:6px; }

.playlist li{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px;
  padding: 10px 12px;
  background: var(--tile-bg);
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
}
.playlist li:hover{ border-color: var(--border-soft); }
.playlist li.playing{
  border-color: var(--neon-cyan);
  background: rgba(0,255,242,0.08);
  box-shadow: 0 0 10px rgba(0,255,242,0.25) inset;
  color: var(--neon-cyan);
}
.playlist li .track-index{ color: var(--text-dim); margin-right: 8px; }
.playlist li .track-title{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.playlist li .track-tag{
  font-size: 0.65rem; padding: 2px 7px; border-radius: 20px;
  border: 1px solid var(--border-soft); color: var(--text-dim);
  text-transform: uppercase;
}

/* ===================== PHẦN 2: DJ SOUND PAD ===================== */
/* Gộp chung 15 pad trong 1 lưới duy nhất, 5 cột = vừa đủ 3 hàng,
   không cần cuộn -> nhìn thấy hết và bấm nhanh khi đang chạy sự kiện.
   Dùng minmax(0,1fr) thay vì 1fr để MỌI cột luôn rộng bằng nhau, không
   bị 1 pad có nội dung dài kéo lệch kích cỡ cả lưới. */
.pad-grid{
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
}

@media (max-width: 900px){
  /* Khi 2 cột chính gộp thành 1 cột, panel Pad rộng hơn hẳn */
  .pad-grid{ grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
@media (max-width: 600px){
  .pad-grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 420px){
  .pad-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.pad-cell{
  display:flex; flex-direction:column; align-items:center; gap:5px;
  min-width: 0; /* Không cho nội dung bên trong ép cột giãn không đều */
}

.pad-btn{
  position: relative;
  width: 100%;
  min-width: 0;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  border: 2px solid var(--pad-color, var(--neon-pink));
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.06), var(--pad-radial-end) 70%);
  color: var(--text-main);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: 4px;
  cursor: pointer;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.2px;
  text-transform: uppercase;
  text-align: center;
  padding: 4px;
  transition: transform 0.12s ease, box-shadow 0.2s ease;
  box-shadow: 0 0 0 rgba(0,0,0,0);
}
.pad-btn .pad-icon{ font-size: 1.5rem; }
.pad-btn:hover{ transform: translateY(-2px); box-shadow: 0 0 14px var(--pad-color, var(--neon-pink)); }
.pad-btn:active{ transform: scale(0.97); }

/* Badge hiển thị phím tắt bàn phím ngay trên mỗi Pad */
.pad-key{
  position: absolute;
  top: 5px; right: 6px;
  font-size: 0.6rem;
  padding: 1px 5px;
  border-radius: 6px;
  background: rgba(0,0,0,0.35);
  color: var(--text-dim);
  letter-spacing: 0.5px;
  font-weight: 700;
  text-transform: uppercase;
}

/* Hiệu ứng LED phát sáng khi Pad đang phát */
.pad-btn.playing{
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.12), var(--pad-radial-playing-end) 70%);
  box-shadow:
    0 0 12px var(--pad-color, var(--neon-pink)),
    0 0 30px var(--pad-color, var(--neon-pink)),
    inset 0 0 18px rgba(255,255,255,0.08);
  animation: pad-pulse 0.9s infinite ease-in-out;
}
@keyframes pad-pulse{
  0%,100%{ filter: brightness(1); }
  50%{ filter: brightness(1.35); }
}

.pad-file-row{
  width:100%;
}
/* Nút "Đổi âm thanh" phóng to full-width, dễ thấy dễ bấm hơn bản pill nhỏ cũ.
   overflow:hidden + text-overflow:ellipsis giữ cho nội dung không bao giờ
   ép lưới Pad giãn lệch, dù tên rất dài. */
.pad-file-label{
  display:block;
  width: 100%;
  box-sizing: border-box;
  font-size: 0.76rem;
  font-weight: 700;
  padding: 8px 6px;
  border-radius: 8px;
  border: 1.5px solid var(--border-soft);
  background: var(--tile-bg);
  color: var(--text-main);
  cursor: pointer;
  letter-spacing: 0.3px;
  text-align: center;
  transition: all 0.2s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pad-file-label:hover{
  border-color: var(--neon-cyan);
  color: var(--neon-cyan);
  box-shadow: 0 0 10px rgba(0,255,242,0.3);
}
.pad-file-input{ display:none; }

.pad-current-file{
  font-size: 0.66rem;
  color: var(--text-dim);
  max-width: 100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* Footer nhỏ */
footer{
  text-align:center;
  margin-top: 34px;
  color: var(--text-dim);
  font-size: 0.75rem;
  letter-spacing: 1px;
}
footer span{ color: var(--neon-pink); }


/* ===== Màn hình khóa mật khẩu ===== */
.lockwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(160deg,#dce6f7,#eef1fb);}
:root[data-theme="dark"] .lockwrap{background:linear-gradient(160deg,#101018,#181a24);}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lockwrap{background:linear-gradient(160deg,#101018,#181a24);}}
.lockcard{background:#fff;border-radius:18px;box-shadow:0 20px 50px -20px rgba(20,25,60,.35);

.lockerror{color:#dc2626;font-size:12.5px;margin:4px 0 10px;text-align:left;display:none;}
.lockbtn{width:100%;padding:12px;border:0;border-radius:9px;background:#3b6fea;color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:filter .15s;font-family:inherit;}
.lockbtn:hover{filter:brightness(.92);}
.lockbtn:disabled{opacity:.6;cursor:default;}
.lockhr{border:0;border-top:1px solid #e6e9f2;margin:22px 0 16px;}

.lockfooter{font-size:11.5px;color:#8a90a6;line-height:1.6;}
.lockfooter a{color:#3b6fea;text-decoration:none;}
.lockfooter a:hover{text-decoration:underline;}

function hexToBytes(hex){
  var bytes = new Uint8Array(hex.length/2);
  for(var i=0;i<bytes.length;i++) bytes[i] = parseInt(hex.substr(i*2,2),16);
  return bytes;
}
function base64ToBytes(b64){
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function bytesToBase64(bytes){
  var binary = '';
  var chunk = 0x8000;
  for(var i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(binary);
}

var SALT = hexToBytes(SALT_HEX);
var IV = hexToBytes(IV_HEX);
var CT = base64ToBytes(CT_B64);

function deriveKeyFromPassword(password){
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']).then(function(baseKey){
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: SALT, iterations: 300000, hash:'SHA-256' },
      baseKey, { name:'AES-GCM', length:256 }, true, ['decrypt']
    );
  });
}
function importRawKey(rawB64){
  return crypto.subtle.importKey('raw', base64ToBytes(rawB64), {name:'AES-GCM'}, true, ['decrypt']);
}
function decryptWithKey(key){
  return crypto.subtle.decrypt({name:'AES-GCM', iv: IV}, key, CT).then(function(buf){
    return new TextDecoder().decode(buf);
  });
}
function revealContent(html){
  var scripts = [];
  var markup = html.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gi, function(m, code){
    scripts.push(code);
    return '';
  });
  document.getElementById('realContent').innerHTML = markup;
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('realContent').style.display = '';
  scripts.forEach(function(code){
    var s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  });
}
function showError(msg){
  var el = document.getElementById('lockError');
  el.textContent = msg;
  el.style.display = 'block';
}

function tryUnlock(password){
  return deriveKeyFromPassword(password).then(function(key){
    return decryptWithKey(key).then(function(html){
      return crypto.subtle.exportKey('raw', key).then(function(raw){
        try{ sessionStorage.setItem('avltools-lockkey', bytesToBase64(new Uint8Array(raw))); }catch(e){}
        revealContent(html);
      });
    });
  });
}

function tryAutoUnlock(){
  var cached;
  try{ cached = sessionStorage.getItem('avltools-lockkey'); }catch(e){ cached = null; }
  if(!cached) return;
  importRawKey(cached).then(decryptWithKey).then(revealContent).catch(function(){ /* im lặng, hiện màn hình nhập mật khẩu */ });
}
tryAutoUnlock();

var btn = document.getElementById('btnUnlock');
var pwInput = document.getElementById('pwInput');
function doUnlock(){
  var pw = pwInput.value;
  if(!pw) return;
  document.getElementById('lockError').style.display = 'none';
  btn.disabled = true; btn.textContent = 'Đang mở...';
  tryUnlock(pw).catch(function(){
    showError('Sai mật khẩu, vui lòng thử lại.');
  }).then(function(){
    btn.disabled = false; btn.textContent = 'Mở khóa';
  });
}
btn.addEventListener('click', doUnlock);
pwInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') doUnlock(); });
})();
