<style>

:root{
  --bg:#f2f4f8; --panel:#ffffff; --panel2:#f7f9fc; --line:#dde2ea;
  --txt:#141922; --dim:#5d6675; --dim2:#8d97a6;
  --sky:#0284c7; --sky-dim:#e0f2fe; --sky-txt-on-dim:#075985;
  --amber:#f59e0b; --amber-dim:#78350f;
  --red:#ef4444; --red-dim:#7f1d1d;
  --green:#22c55e;
  --shadow:0 1px 2px rgba(20,25,34,.05), 0 8px 24px -12px rgba(20,25,34,.18);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e11; --panel:#17171c; --panel2:#1d1d23; --line:#2b2b33;
    --txt:#ececed; --dim:#9498a3; --dim2:#6b6e78;
    --sky:#38bdf8; --sky-dim:#0c4a6e; --sky-txt-on-dim:#bfeaff;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e11; --panel:#17171c; --panel2:#1d1d23; --line:#2b2b33;
  --txt:#ececed; --dim:#9498a3; --dim2:#6b6e78;
  --sky:#38bdf8; --sky-dim:#0c4a6e; --sky-txt-on-dim:#bfeaff;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); padding:16px;
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:14px;
}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
  border-radius:8px;transition:.12s}
button:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
input[type=text]{font-family:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  color:var(--txt);padding:5px 7px;font-size:12.5px}
input[type=text]:focus{outline:0;border-color:var(--sky)}
.wrap{max-width:1400px;margin:0 auto}

/* ---------- header (đồng bộ thương hiệu chung của site) ---------- */
.topbar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.topbar .brand-link{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.topbar .logo{width:34px;height:34px;flex:0 0 auto;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.topbar .logo svg{display:block;width:100%;height:100%}
.topbar .brand-name{font-size:15px;font-weight:700;letter-spacing:.01em;line-height:1.2;color:var(--txt)}
.topbar .brand-sub{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar .home{font-size:12px;color:var(--dim);text-decoration:none;
  border:1px solid var(--line);border-radius:8px;padding:6px 12px;white-space:nowrap}
.topbar .home:hover{background:var(--panel2);color:var(--txt);border-color:var(--dim2)}
.theme-toggle{display:flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;flex:0 0 auto;
  border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--dim)}
.theme-toggle:hover{color:var(--txt);border-color:var(--dim2)}
.theme-toggle svg{width:16px;height:16px}
.theme-toggle .i-sun{display:block}
.theme-toggle .i-moon{display:none}
:root[data-theme="dark"] .theme-toggle .i-sun{display:none}
:root[data-theme="dark"] .theme-toggle .i-moon{display:block}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-toggle .i-sun{display:none}
  :root:not([data-theme="light"]) .theme-toggle .i-moon{display:block}
}

/* ---------- control strip: live indicator + fade/panic ---------- */
.control-strip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;
  box-shadow:var(--shadow);margin-bottom:14px}
.live{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.04em}
.live .dot{width:9px;height:9px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:ping 1.6s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}100%{box-shadow:0 0 0 9px rgba(34,197,94,0)}}
.control-strip .spacer{flex:1}
.btn-fade{background:var(--amber-dim);border-color:var(--amber);color:#fde3b0;font-weight:700;
  padding:10px 18px;border-radius:10px;font-size:13px}
.btn-fade:hover{background:var(--amber);color:#2a1a02}
.btn-panic{background:var(--red);border-color:var(--red);color:#fff;font-weight:800;letter-spacing:.02em;
  padding:10px 20px;border-radius:10px;font-size:13px;box-shadow:0 4px 14px -4px rgba(239,68,68,.6)}
.btn-panic:hover{background:#dc2626}
.btn-panic:active,.btn-fade:active{transform:scale(.97)}

/* ---------- main layout ---------- */
.board{display:grid;grid-template-columns:minmax(320px,42%) 1fr;gap:14px;align-items:start}
@media(max-width:900px){.board{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.panel-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}
.panel-hd h2{font-size:14px;display:flex;align-items:center;gap:8px}
.panel-hd .icon{width:20px;height:20px}
.toggle{font-size:10.5px;padding:5px 9px;border-radius:6px;color:var(--dim)}
.toggle.on{background:var(--sky-dim);border-color:var(--sky);color:var(--sky-txt-on-dim)}

/* ---------- playlist ---------- */
.go-btn{width:100%;padding:20px;border-radius:12px;font-weight:900;font-size:19px;letter-spacing:.12em;
  background:linear-gradient(180deg,#22c55e,#16a34a);color:#04220f;border:1px solid #16a34a;margin-bottom:12px}
.go-btn:hover{filter:brightness(1.08)}
.go-btn:active{transform:scale(.99)}
.add-row{display:flex;gap:8px;margin-bottom:10px}
.add-row button{flex:1;padding:8px;font-size:12.5px;border-style:dashed;color:var(--dim)}
.add-row button:hover{color:var(--txt);border-color:var(--sky)}
#trackList{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;margin-bottom:12px;
  min-height:60px;border-radius:10px}
#trackList.dragover{outline:2px dashed var(--sky);outline-offset:-2px}
.track{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-left:3px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.track:hover{border-color:var(--dim2)}
.track.current{border-left-color:var(--sky)}
.track.playing{background:var(--sky-dim);border-left-color:var(--sky)}
.track .idx{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim2);width:18px;flex:0 0 auto}
.track .name{flex:1;font-size:12.5px;background:transparent;border:0;color:inherit;min-width:0}
.track .name:focus{outline:1px solid var(--sky);border-radius:4px}
.track .state{font-size:10px;color:var(--dim2);font-family:ui-monospace,Consolas,monospace;flex:0 0 auto}
.track.playing .state{color:var(--sky)}
.track .mv{flex:0 0 auto;display:flex;gap:2px}
.track .mv button{width:20px;height:20px;font-size:10px;padding:0;line-height:1;color:var(--dim2)}
.track .mv button:hover{color:var(--txt)}
.empty-hint{color:var(--dim2);font-size:12px;text-align:center;padding:24px 10px;border:1.5px dashed var(--line);
  border-radius:8px}

/* ---------- soundboard ---------- */
.sfx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.pad{position:relative;aspect-ratio:1.15;border-radius:12px;border:1px solid var(--line);background:var(--panel2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;
  padding:10px;overflow:hidden}
.pad.empty{border-style:dashed;cursor:pointer;color:var(--dim2);font-size:11.5px;line-height:1.5}
.pad.empty:hover{border-color:var(--amber);color:var(--dim)}
.pad.dragover{outline:2px dashed var(--amber);outline-offset:-2px}
.pad.loaded{cursor:pointer;border-color:var(--line)}
.pad.loaded:hover{border-color:var(--amber)}
.pad.active{background:var(--amber);border-color:var(--amber);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.18)}}
.pad .key{position:absolute;top:6px;right:7px;font-size:9.5px;font-family:ui-monospace,Consolas,monospace;
  color:var(--dim2);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.pad.active .key{color:#3a2400;background:rgba(0,0,0,.25);border-color:transparent}
.pad .icon{width:26px;height:26px}
.pad .label{font-size:12px;font-weight:600;color:var(--txt);word-break:break-word;max-width:100%;
  background:transparent;border:0;text-align:center;font-family:inherit}
.pad.active .label{color:#2a1a02}
.pad .label:focus{outline:1px solid var(--sky);border-radius:4px}
.pad .tools{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:4px;
  opacity:0;transition:opacity .12s}
.pad.loaded:hover .tools{opacity:1}
.pad .tools button{font-size:9.5px;padding:2px 6px;border-radius:5px;background:var(--bg);color:var(--dim)}
.pad .tools button:hover{color:var(--txt);border-color:var(--dim2)}
.pad.binding{outline:2px solid var(--sky);outline-offset:-2px}
.pad.binding::after{content:"Bấm phím bất kỳ…";position:absolute;inset:0;background:rgba(14,14,17,.9);
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#7dd3fc;text-align:center;padding:8px}
.pad-add{border:1.5px dashed var(--line);border-radius:12px;aspect-ratio:1.15;display:flex;align-items:center;
  justify-content:center;color:var(--dim2);font-size:26px;cursor:pointer}
.pad-add:hover{color:var(--amber);border-color:var(--amber)}

/* ---------- volume rows ---------- */
.vol-row{border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.vol-row .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:6px}
input[type=range]{width:100%;height:5px;border-radius:3px;appearance:none;background:var(--panel2);outline:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--sky);cursor:pointer;border:2px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--sky);
  cursor:pointer;border:2px solid var(--bg)}
#sfxVol::-webkit-slider-thumb{background:var(--amber)}
#sfxVol::-moz-range-thumb{background:var(--amber)}

/* ---------- footer ---------- */
.footbar{max-width:1400px;margin:16px auto 0;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;
  align-items:center;font-size:11px;color:var(--dim2);border-top:1px solid var(--line);padding-top:12px}
.footbar code{background:var(--panel2);border:1px solid var(--line);padding:1px 5px;border-radius:4px;color:var(--amber)}
.credit{max-width:1400px;margin:10px auto 0;text-align:center;font-size:11px;color:var(--dim2)}
.credit b{color:var(--dim)}
.credit a{color:var(--sky);text-decoration:none}
.credit a:hover{text-decoration:underline}


/* ===== Màn hình khóa mật khẩu ===== */
.lockwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(160deg,#dce6f7,#eef1fb);}
:root[data-theme="dark"] .lockwrap{background:linear-gradient(160deg,#101018,#181a24);}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lockwrap{background:linear-gradient(160deg,#101018,#181a24);}}
.lockcard{background:#fff;border-radius:18px;box-shadow:0 20px 50px -20px rgba(20,25,60,.35);
  padding:36px 32px;max-width:380px;width:100%;text-align:center;}
:root[data-theme="dark"] .lockcard{background:#181920;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lockcard{background:#181920;}}
.lockicon{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;
  background:linear-gradient(145deg,#ffcf7a,#f5a623);display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 8px 20px -6px rgba(245,166,35,.6);}
.locktitle{font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:700;color:#1c2541;margin-bottom:6px;}
:root[data-theme="dark"] .locktitle{color:#ececed;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .locktitle{color:#ececed;}}
.locksub{font-size:13px;color:#697086;margin-bottom:22px;line-height:1.5;}
:root[data-theme="dark"] .locksub{color:#9498a3;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .locksub{color:#9498a3;}}
.lockinput{width:100%;padding:12px 14px;border-radius:9px;border:1.5px solid #d7dced;
  font-size:14px;margin-bottom:6px;outline:none;box-sizing:border-box;background:#fff;color:#1c2541;font-family:inherit;}
.lockinput:focus{border-color:#3b6fea;box-shadow:0 0 0 3px rgba(59,111,234,.15);}
:root[data-theme="dark"] .lockinput{background:#101116;border-color:#2b2b33;color:#ececed;}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lockinput{background:#101116;border-color:#2b2b33;color:#ececed;}}
.lockerror{color:#dc2626;font-size:12.5px;margin:4px 0 10px;text-align:left;display:none;}
.lockbtn{width:100%;padding:12px;border:0;border-radius:9px;background:#3b6fea;color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:filter .15s;font-family:inherit;}
.lockbtn:hover{filter:brightness(.92);}
.lockbtn:disabled{opacity:.6;cursor:default;}
.lockhr{border:0;border-top:1px solid #e6e9f2;margin:22px 0 16px;}
:root[data-theme="dark"] .lockhr{border-top-color:#2b2b33;}
.lockfooter{font-size:11.5px;color:#8a90a6;line-height:1.6;}
.lockfooter a{color:#3b6fea;text-decoration:none;}
.lockfooter a:hover{text-decoration:underline;}
</style>
</head>

function hexToBytes(hex){
  var bytes = new Uint8Array(hex.length/2);
  for(var i=0;i<bytes.length;i++) bytes[i] = parseInt(hex.substr(i*2,2),16);
  return bytes;
}
function base64ToBytes(b64){
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function bytesToBase64(bytes){
  var binary = '';
  var chunk = 0x8000;
  for(var i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(binary);
}

var SALT = hexToBytes(SALT_HEX);
var IV = hexToBytes(IV_HEX);
var CT = base64ToBytes(CT_B64);

function deriveKeyFromPassword(password){
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']).then(function(baseKey){
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: SALT, iterations: 300000, hash:'SHA-256' },
      baseKey, { name:'AES-GCM', length:256 }, true, ['decrypt']
    );
  });
}
function importRawKey(rawB64){
  return crypto.subtle.importKey('raw', base64ToBytes(rawB64), {name:'AES-GCM'}, true, ['decrypt']);
}
function decryptWithKey(key){
  return crypto.subtle.decrypt({name:'AES-GCM', iv: IV}, key, CT).then(function(buf){
    return new TextDecoder().decode(buf);
  });
}
function revealContent(html){
  var scripts = [];
  var markup = html.replace(/<script\b[^>]*>([\s\S]*?)<\/script>/gi, function(m, code){
    scripts.push(code);
    return '';
  });
  document.getElementById('realContent').innerHTML = markup;
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('realContent').style.display = '';
  scripts.forEach(function(code){
    var s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  });
}
function showError(msg){
  var el = document.getElementById('lockError');
  el.textContent = msg;
  el.style.display = 'block';
}

function tryUnlock(password){
  return deriveKeyFromPassword(password).then(function(key){
    return decryptWithKey(key).then(function(html){
      return crypto.subtle.exportKey('raw', key).then(function(raw){
        try{ sessionStorage.setItem('avltools-lockkey', bytesToBase64(new Uint8Array(raw))); }catch(e){}
        revealContent(html);
      });
    });
  });
}

function tryAutoUnlock(){
  var cached;
  try{ cached = sessionStorage.getItem('avltools-lockkey'); }catch(e){ cached = null; }
  if(!cached) return;
  importRawKey(cached).then(decryptWithKey).then(revealContent).catch(function(){ /* im lặng, hiện màn hình nhập mật khẩu */ });
}
tryAutoUnlock();

var btn = document.getElementById('btnUnlock');
var pwInput = document.getElementById('pwInput');
function doUnlock(){
  var pw = pwInput.value;
  if(!pw) return;
  document.getElementById('lockError').style.display = 'none';
  btn.disabled = true; btn.textContent = 'Đang mở...';
  tryUnlock(pw).catch(function(){
    showError('Sai mật khẩu, vui lòng thử lại.');
  }).then(function(){
    btn.disabled = false; btn.textContent = 'Mở khóa';
  });
}
btn.addEventListener('click', doUnlock);
pwInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') doUnlock(); });
})();
